name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # allows manual trigger

# Sets permissions for deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18          # LTS; works well with CRA 4
          cache: 'npm'

      - name: Install dependencies
        run: npm install               # faster and stricter (uses package-lock.json)  
        
      - name: Build the project
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build      # <-- correct folder for CRA
          keep_files: false
          # force_orphan: true      # (optional) clean gh-pages branch each time
